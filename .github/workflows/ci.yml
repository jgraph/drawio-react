name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Catches changes of the embed protocol in jgraph/drawio
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The editor: embed.diagrams.net does not serve headless browsers
      - uses: actions/checkout@v5
        with:
          repository: jgraph/drawio
          path: drawio
          sparse-checkout: src/main/webapp

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Chrome for Testing
        run: npx @puppeteer/browsers install chrome@stable --path ~/.cache/puppeteer

      - name: Serve draw.io
        run: python3 -m http.server 8080 --bind 127.0.0.1 --directory drawio/src/main/webapp > /dev/null 2>&1 &

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          DRAWIO_URL: http://127.0.0.1:8080/
