name: Publish

# Publishes the package to npm as @drawio/react via npm Trusted Publishing:
# the registry trusts this workflow's OIDC identity, so there is no token in
# the repo, and npm attaches a provenance attestation.
#
# One-time setup on npmjs.com (Package settings > Publishing access > Trusted
# publisher): GitHub Actions, repository `jgraph/drawio-react`, workflow file
# `publish.yml`, no environment. Renaming this file breaks the trust.
#
# The version published is whatever package.json says; bump and commit it
# first. Publishing an existing version fails the run early.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify, but do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      # No registry-url / NODE_AUTH_TOKEN here on purpose: a token-shaped
      # .npmrc would take precedence over the OIDC exchange.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check the version is new
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "@drawio/react@$version" version > /dev/null 2>&1; then
            echo "::error::@drawio/react@$version is already on the registry, bump the version first."
            exit 1
          fi

          echo "Publishing @drawio/react@$version"

      # prepack runs the build
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public

      - name: Pack only (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

      - name: Summary
        run: |
          {
            echo "### @drawio/react@${{ steps.version.outputs.version }}"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run, nothing was published."
            else
              echo "Published to https://www.npmjs.com/package/@drawio/react/v/${{ steps.version.outputs.version }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
